import os
from google import genai

def start_agent():
    print("PogoPals AI Agent Started!")

    api_key = os.getenv("GEMINI_API_KEY")

    if not api_key:
        raise ValueError("Gemini API Key not found!")

    client = genai.Client(api_key=api_key)

    print("Generating a Hindi Story...")

    response = client.models.generate_content(
        model="gemini-2.5-flash",
        contents="""
        Write a beautiful and original Hindi
        children's story.

        Include:
        1. An interesting title
        2. Cute animal characters
        3. Adventure and friendship
        4. A happy ending
        5. A moral lesson
        """
    )

    print("\n===== POGOPALS STORY =====\n")
    print(response.text)
    print("\n===== STORY COMPLETED =====")

start_agent()
